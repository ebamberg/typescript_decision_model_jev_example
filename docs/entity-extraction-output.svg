    <text x="28" y="651" fill="#abb2bf">| Invoice number | <tspan fill="#98c379">INV-2026-1042</tspan>        |</text>
    <text x="28" y="677" fill="#abb2bf">| Order number   | <tspan fill="#e5c07b">inconfident</tspan>          |</text>
    <text x="28" y="703" fill="#abb2bf">| Total due      | <tspan fill="#98c379">€1,248.50</tspan>            |</text>
