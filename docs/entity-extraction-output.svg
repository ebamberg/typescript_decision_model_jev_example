    <text x="46" y="411" fill="#858b95">3: ORD-58319                [██████------------------] 26.0%</text>
    <text x="46" y="433" fill="#858b95">4: None of the above        [------------------------] 1.0%</text>

    <text x="28" y="467" fill="#56b6c2" font-weight="700">billing_email</text><text x="160" y="467" fill="#abb2bf">(score: 0.01, confidence: 99%)</text>
    <text x="46" y="493" fill="#98c379">0: billing@example.com      [████████████████████████] 100.0%</text>
    <text x="46" y="515" fill="#858b95">1: alex.morgan@example.com  [------------------------] 0.0%</text>
