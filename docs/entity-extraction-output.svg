<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title description">
  <title id="title">Synthetic entity extraction output</title>
  <desc id="description">Terminal-style answer charts followed by an invoice object. The order number is marked inconfident because its answer confidence is below 60 percent.</desc>
  <rect width="900" height="760" rx="8" fill="#17191c"/>
  <path d="M0 8a8 8 0 0 1 8-8h884a8 8 0 0 1 8 8v34H0z" fill="#25282d"/>
  <circle cx="24" cy="21" r="6" fill="#e06c75"/>
  <circle cx="46" cy="21" r="6" fill="#e5c07b"/>
  <circle cx="68" cy="21" r="6" fill="#98c379"/>
  <text x="450" y="26" text-anchor="middle" fill="#abb2bf" font-family="Segoe UI, sans-serif" font-size="13">entity extraction</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="28" y="77" fill="#56b6c2" font-weight="700">=== ENTITY EXTRACTION ===</text>

